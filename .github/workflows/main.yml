name: 5K Volume Momentum Sniper

on:
  schedule:
    # 提早於台灣時間 07:35, 07:45, 07:55, 08:05 密集點火 (對應 UTC 前一日 23:35 ~ 23:55 + 當日 00:05)
    # 2026-10-30 使用者定：怕 GitHub 排程延遲，整體提早半小時，確保 08:20 前預熱完畢待命！
    - cron: '35,45,55 23 * * 0-4'
    - cron: '5 0 * * 1-5'
  workflow_dispatch: # 支援手動立刻啟動

# 保護常駐任務：只要第一班車已啟動常駐，後續排程不會將其切斷
concurrency:
  group: tw-stock-5k-sniper
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan-market:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 給予 6 小時充裕權限 (07:35 ~ 13:35 全場不斷電)
    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 啟動 0延遲外盤大單與5K雷達
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u bot.py
