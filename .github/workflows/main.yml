name: 5K Volume Momentum Sniper

on:
  schedule:
    # 1. 主力常駐排程：台灣時間週一至週五 08:55 啟動 (UTC 00:55)，一鏡到底常駐跑到 13:35 收盤！
    - cron: '55 0 * * 1-5'
    # 2. 備援喚醒排程：萬一盤中手動修改程式碼或中斷，每小時整點自動檢查並無縫接手
    - cron: '0 1-5 * * 1-5'
  workflow_dispatch: # 隨時可手動點擊測試

# 防止多個排程同時撞車：若已經有一台常駐雷達在跑，新的排程就不會重複打斷它
concurrency:
  group: tw-stock-5k-sniper
  cancel-in-progress: false

jobs:
  scan-market:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 給予最長 5.5 小時不斷電執行權限 (涵蓋 08:55 ~ 13:35 全場)
    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 啟動 5K 極速常駐雷達
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u bot.py
