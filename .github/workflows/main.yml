name: 5K Volume Momentum Sniper

on:
  schedule:
    # 台灣時間週一至週五 09:00 ~ 13:35 (對應 UTC 時間 01:00 ~ 05:35)，每 5 分鐘執行一次
    - cron: '*/5 1-5 * * 1-5'
  workflow_dispatch: # 保留手動測試按鈕

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 執行 5K 爆量偵測腳本
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
