name: 5K Volume Momentum Sniper

on:
  schedule:
    # 台灣時間週一至週五 08:35 提前啟動 (對應 UTC 00:35)
    # 避開整點排程尖峰，於開盤前完成全市場均量預熱，一路常駐監控至 13:35 收盤！
    - cron: '35 0 * * 1-5'
  workflow_dispatch: # 隨時可手動點擊立刻接管執行

# 若手動點擊測試或觸發新排程，立刻終止舊的卡住任務並由新任務無縫接管，絕不排隊卡死
concurrency:
  group: tw-stock-5k-sniper
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan-market:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # 給予最長 5小時40分 執行權限 (涵蓋 08:35 ~ 13:35 全場)
    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 啟動 5K 極速常駐雷達
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u bot.py
